<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>التسجيل في المركز</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Amiri', serif;
      background-color: #ffe6cc;
      background-image: url('C:/Users/ACER/Desktop/New folder (4)/pngtree-abstract-blue-sky-image_984663.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-form {
      width: 300px;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      text-align: center;
      border-radius: 60px 5px 60px 5px;
      border: 2px solid rgb(101, 110, 110);
      box-shadow: 5px 5px 50px 50px rgba(110, 136, 150, 0.5);
      animation: animateBg 5s linear infinite;
    }

    input, select {
      border-radius: 30px;
      padding: 0.5rem;
      margin-top: 10px;
      margin-bottom: 15px;
      width: 90%;
      border: 2px solid #ccc;
      background: #ffe6cc;
      color: #333;
      font-family: Arial, sans-serif;
    }

    input[type="button"] {
      cursor: pointer;
      font-weight: bold;
      background-color: #009999;
      color: white;
      border-radius: 10px;
      transition: background-color 0.3s ease;
    }

    input[type="button"]:hover {
      background-color: #007777;
    }

    label {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="login-form">
    <form id="registrationForm">
      <label>الاسم:
        <input name="username" type="text" required>
      </label><br>

      <label>الهاتف:
        <input name="userphone" type="tel" required>
      </label><br>

      <label>العمر:
        <input name="age" type="text" required>
      </label><br>

      <label>المستوى:
        <input name="level" type="text" required>
      </label><br>

      <label>نوع المستخدم:
        <select id="usertype" name="usertype" required>
          <option value="">اختر النوع</option>
          <option value="طالب">طالب</option>
          <option value="معلم">معلم</option>
          <option value="مشرف">مشرف</option>
        </select>
      </label><br>

      <input type="button" value="تسجيل" onclick="handleRegister()">
    </form>
  </div>

 <script>
  function handleRegister() {
    const userType = document.getElementById("usertype").value;

    if (userType === "طالب" || userType === "معلم" || userType === "مشرف") {
      // تسجيل ناجح → ننقل المستخدم للصفحة الرئيسية
      window.location.href = "C:\Users\ACER\Desktop\New folder (4)\Home.html";
    } else {
      alert("يرجى اختيار نوع المستخدم");
    }
  }
</script>


</body>
</html>
